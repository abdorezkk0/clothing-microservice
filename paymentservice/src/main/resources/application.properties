server.port=8085
spring.application.name=payment-service

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/clothing_platform_payments?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=u8re4cvm

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=YourSecretKeyHereMustBeAtLeast256BitsLongForHS256Algorithm
jwt.expiration=86400000

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/

# RabbitMQ Exchange and Queue Configuration
rabbitmq.exchange.payment=payment.exchange
rabbitmq.queue.payment.success=payment.success.queue
rabbitmq.queue.payment.failed=payment.failed.queue
rabbitmq.queue.payment.refund=payment.refund.queue
rabbitmq.routing.key.payment.success=payment.success
rabbitmq.routing.key.payment.failed=payment.failed
rabbitmq.routing.key.payment.refund=payment.refund

# Actuator Endpoints
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.security.enabled=false

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.clothing.paymentservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.amqp=DEBUG