server:
  port: 8085

spring:
  application:
    name: payment-service
  
  datasource:
    url: jdbc:mysql://localhost:3306/clothing_platform_payments?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: u8re4cvm
  
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

jwt:
  secret: YourSecretKeyHereMustBeAtLeast256BitsLongForHS256Algorithm
  expiration: 86400000

# RabbitMQ Exchange and Queue Configuration
rabbitmq:
  exchange:
    payment: payment.exchange
  queue:
    payment:
      success: payment.success.queue
      request: payment.request.queue
      failed: payment.failed.queue
      refund: payment.refund.queue
  routing:
    key:
      payment:
        success: payment.success
        request: payment.request
        failed: payment.failed
        refund: payment.refund

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.web: DEBUG
    com.clothing.paymentservice: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.amqp: DEBUG