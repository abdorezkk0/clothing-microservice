server:
  port: 9090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # User Service Route
        - id: userservice
          uri: lb://USERSERVICE
          predicates:
            - Path=/userservice/**
          filters:
            - StripPrefix=1

        # Product Service Route
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1

        # Cart Service Route
        - id: cartservice
          uri: lb://CARTSERVICE
          predicates:
            - Path=/cartservice/**
          filters:
            - StripPrefix=1

        # Order Service Route
        - id: orderservice
          uri: lb://ORDERSERVICE
          predicates:
            - Path=/orderservice/**
          filters:
            - StripPrefix=1

        # Payment Service Route
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payment-service/**
          filters:
            - StripPrefix=1

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # ✅ FIXED: Global CORS Configuration (was cors-configurations, should be corsConfigurations)
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders: "*"
            allowCredentials: false

      # ✅ NEW: Default filters to preserve headers
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # ✅ NEW: HTTP client configuration to preserve headers
      httpclient:
        wiretap: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: localhost
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    com.clothing.gateway.security: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG